version: '2.2'

services:
  admin:
    container_name: admin
    build:
      context: .
      dockerfile: ./docker/Dockerfile.admin
    restart: always
    command: [ "./admin_entrypoint.sh" ]
    env_file:
      - ./.env
    depends_on:
      - database
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

  bot:
    container_name: bot
    build:
      context: .
      dockerfile: ./docker/Dockerfile.admin
    restart: always
    command: [ "./bot_entrypoint.sh" ]
    env_file:
      - ./.env
    depends_on:
      - database
      - redis
    volumes:
      - ./src:/app

  tracker_bot:
    container_name: tracker_bot
    build:
      context: .
      dockerfile: ./docker/Dockerfile.admin
    restart: always
    command: [ "./bot_tracker_entrypoint.sh" ]
    env_file:
      - ./.env
    depends_on:
      - database
      - redis
    volumes:
      - ./src:/app

  database:
    image: postgres:13-alpine
    container_name: database
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
    volumes:
      - ./db/:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    expose:
      - 5432

volumes:
  static-files: null
  db-data: null
